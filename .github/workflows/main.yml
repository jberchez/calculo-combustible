name: Actualizar precios de carburantes

on:
  schedule:
    # Todos los días a las 06:00 hora de España (05:00 UTC en horario de invierno)
    - cron: "0 5 * * *"
  workflow_dispatch: {} # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Descargar y calcular precios
        run: node fetch_prices.js

      - name: Publicar cambios si hay precios nuevos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add precios-carburantes.json
          git diff --quiet --cached || git commit -m "Actualizar precios de carburantes"
          git push
